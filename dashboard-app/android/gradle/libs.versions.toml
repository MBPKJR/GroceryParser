[versions]
# SDK Versions
minSdkVersion = "24"
compileSdkVersion = "36"
targetSdkVersion = "36"

# Library Versions
androidxActivity = "1.11.0"
androidxAppCompat = "1.7.1"
androidxCoordinatorLayout = "1.3.0"
androidxCore = "1.17.0"
androidxFragment = "1.8.9"
coreSplashScreen = "1.2.0"
androidxWebkit = "1.14.0"
junit = "4.13.2"
androidxJunit = "1.3.0"
androidxEspressoCore = "3.7.0"
cordovaAndroid = "14.0.1"
agp = "8.13.0"
googleServices = "4.4.4"

[libraries]
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "androidxActivity" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidxAppCompat" }
androidx-coordinatorlayout = { group = "androidx.coordinatorlayout", name = "coordinatorlayout", version.ref = "androidxCoordinatorLayout" }
androidx-core = { group = "androidx.core", name = "core", version.ref = "androidxCore" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashScreen" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "androidxFragment" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "androidxWebkit" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidxEspressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
